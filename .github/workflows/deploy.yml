name: Deploy Edge Functions to VPS

on:
  push:
    branches:
      - master
      - main
      - feat/criafy-meta-compliance-callbacks
    paths:
      - '.github/workflows/deploy.yml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Apply database migrations
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22022" supabase/migrations/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/criafy-migrations/
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -eu
            DB_CONTAINER=$(docker ps --format "{{.Names}}" | grep -E "^qualify-supabase-(db|postgres)$" | head -n 1)
            test -n "$DB_CONTAINER"
            DB_PASSWORD=$(docker exec "$DB_CONTAINER" printenv POSTGRES_PASSWORD)
            for sql_file in $(find /tmp/criafy-migrations -maxdepth 1 -name "*.sql" | sort); do
              echo "Applying migration: $sql_file"
              docker exec -e PGPASSWORD="$DB_PASSWORD" -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=0 -U postgres -d postgres < "$sql_file" || true
            done
            rm -rf /tmp/criafy-migrations
          '

      - name: Copy functions to VPS via Rsync
        run: |
          # Copia a pasta de functions local para o volume do Supabase na VPS
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22022" supabase/functions/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/qualify-supabase/volumes/functions/

      - name: Configure OAuth secret and recreate functions container
        env:
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          set -eu
          test -n "$INSTAGRAM_APP_SECRET"

          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          printf 'INSTAGRAM_APP_SECRET=%s\n' "$INSTAGRAM_APP_SECRET" > "$secret_file"

          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -az -e "ssh -o StrictHostKeyChecking=no -p 22022" "$secret_file" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/qualify-supabase/.env.criafy

          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -eu
            cd /root/qualify-supabase
            chmod 600 .env.criafy

            cat > docker-compose.criafy-oauth.yml <<"EOF"
          services:
            functions:
              env_file:
                - .env.criafy
          EOF

            docker compose -f docker-compose.yml -f docker-compose.criafy-oauth.yml up -d --force-recreate functions
            docker exec qualify-supabase-edge-functions sh -c '\''test -n "$INSTAGRAM_APP_SECRET"'\''
          '
