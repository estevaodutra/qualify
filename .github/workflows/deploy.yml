name: Deploy Edge Functions to VPS

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/20261014200000_add_criafy_instagram_account_unique.sql'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Apply Criafy Instagram account migration
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22022" supabase/migrations/20261014200000_add_criafy_instagram_account_unique.sql ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/criafy-instagram-account-unique.sql
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -eu
            DB_CONTAINER=$(docker ps --format "{{.Names}}" | grep -E "^qualify-supabase-(db|postgres)$" | head -n 1)
            test -n "$DB_CONTAINER"
            DB_PASSWORD=$(docker exec "$DB_CONTAINER" printenv POSTGRES_PASSWORD)
            docker exec -e PGPASSWORD="$DB_PASSWORD" -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < /tmp/criafy-instagram-account-unique.sql
            rm -f /tmp/criafy-instagram-account-unique.sql
          '

      - name: Copy functions to VPS via Rsync
        run: |
          # Copia a pasta de functions local para o volume do Supabase na VPS
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22022" supabase/functions/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/qualify-supabase/volumes/functions/

      - name: Restart functions container
        run: |
          # Reinicia o container que roda as Edge Functions para carregar o novo código
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "docker restart qualify-supabase-edge-functions"
